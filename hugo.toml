baseURL = "https://actx.cc/"
title = "行思录·MaddingLynx"
languageCode = "zh-hans"
defaultContentLanguage = "zh-hans"
theme = "jant"
paginate = 50
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[permalinks]
  post = "/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["html", "rss"]
  section = ["html"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/atom+xml"
    baseName = "index"
    isPlainText = true
    rel = "alternate"

[mediaTypes]
  [mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

[params]
  description = "行思录·MaddingLynx 的个人博客：记录思考、学习与生活。"
  main_rss_feed = "featured"
  show_jant_branding_on_home = false
  show_header_avatar = true
  noindex = false
  theme_id = "tufte"
  default_theme_id = "tufte"
  font_theme_id = "classic"
  theme_mode = "auto"
  page_size = 50
  archive_page_size = 50
  rss_feed_limit = 50
  site_avatar_url = "/media/sit_01kx2vvh2sesqap1c2h08f6syv/assets/avatar/med_01kx4wbdt1e8gs2stjgebr48jm.png"
  favicon_version = "202607100205"
